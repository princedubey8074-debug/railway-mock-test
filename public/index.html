<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Railway Mock Test</title><style>
body{margin:0;font:16px system-ui;background:#f3f7fb;color:#18304c}header{background:#102a43;color:white;padding:16px;display:flex;justify-content:space-between;gap:10px}main{max-width:950px;margin:20px auto;padding:0 14px}.hero,.card{padding:20px;border-radius:16px;background:white;border:1px solid #dce5ee;margin:12px 0}.hero{background:linear-gradient(120deg,#102a43,#1769aa);color:white}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.muted{color:#64788e;font-size:13px}button{padding:10px 13px;border:0;border-radius:10px;cursor:pointer;font-weight:700;margin:3px}.primary{background:#1769aa;color:white}.outline{background:white;border:1px solid #ccd8e4;color:#18304c}input,textarea,select{padding:10px;border:1px solid #ccd8e4;border-radius:9px;width:100%;box-sizing:border-box;margin:5px 0 12px}.option{display:block;width:100%;text-align:left;background:white;border:1px solid #dce5ee;color:#18304c}.chosen{background:#eaf4ff;border-color:#1769aa}.hidden{display:none}.notice{padding:13px;background:#fff7df;border:1px solid #f0dfa9;border-radius:10px;font-size:13px;line-height:1.5}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.spacer{flex:1}.pal{width:38px;background:#fff;border:1px solid #ccd8e4}.done{background:#dff6e9}.current{outline:2px solid #1769aa}.timer{font-weight:900;font-size:22px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{text-align:left;padding:8px;border-bottom:1px solid #dce5ee}footer{text-align:center;color:#64788e;font-size:12px;padding:18px}@media(max-width:650px){.grid{grid-template-columns:1fr}header{padding:12px;font-size:14px}.card,.hero{padding:15px}}
</style><body><header><b>🚆 Railway Mock Test</b><span id="who"></span><button class="outline" id="authbtn" onclick="authUI()">Login / Register</button></header><main><div id="app"></div></main><footer>Independent practice site. Not affiliated with Indian Railways or any RRB.</footer><script>
let token=localStorage.getItem("rmt_token")||"",me=null,test=null,i=0,answers={},secs=5400,clock=null,lang="en";const $=x=>document.getElementById(x),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(u,o={}){let r=await fetch("/api"+u,{...o,headers:{"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{}),...(o.headers||{})}}),d=await r.json();if(!r.ok)throw Error(d.error||"Error");return d}
function shell(){ $("who").textContent=me?me.username+(me.role==="admin"?" · OWNER":""):"";$("authbtn").textContent=me?"Logout":"Login / Register";$("authbtn").onclick=me?logout:authUI}
function authUI(mode="login"){$("app").innerHTML=`<div class="card"><h2>Student ${mode==="login"?"Login":"Registration"}</h2><div class="row"><button class="outline" onclick="authUI('login')">Login</button><button class="outline" onclick="authUI('register')">Register</button></div><form onsubmit="authSubmit(event,'${mode}')">${mode==="register"?'<label>Mobile number (optional; OTP not enabled)</label><input id="mobile" inputmode="tel">':''}<label>Username</label><input id="username" required minlength="3" maxlength="24"><label>Password (8+ characters)</label><input id="password" type="password" required minlength="8"><button class="primary">${mode==="login"?"Login":"Create account"}</button></form></div>`}
async function authSubmit(e,m){e.preventDefault();try{let d=await api("/"+(m==="login"?"login":"register"),{method:"POST",body:JSON.stringify({username:$("username").value,password:$("password").value,mobile:$("mobile")?.value||""})});token=d.token;localStorage.setItem("rmt_token",token);me=d.user;shell();home()}catch(x){alert(x.message)}}
function logout(){token="";me=null;localStorage.removeItem("rmt_token");shell();publicHome()}
function publicHome(){$("app").innerHTML=`<div class="hero"><h1>Railway Mock Test</h1><p>Free practice tests in a mobile-friendly format.</p><button class="primary" onclick="authUI()">Login / Register</button></div>${disclaimer()}<div class="card"><a href="https://rrb.indianrailways.gov.in/" target="_blank">Official RRB portal</a></div>`}
function disclaimer(){return `<div class="notice"><b>Pattern notice:</b> 100 marks, 90 minutes and 1/3 negative marking are practice settings, not a verified TTE/TC-specific official pattern. Check the relevant official CEN.</div>`}
async function init(){if(token){try{me=(await api("/me")).user;shell();return home()}catch{token="";localStorage.removeItem("rmt_token")}}shell();publicHome()}
async function home(){clearInterval(clock);try{let [t,n]=await Promise.all([api("/tests"),api("/notices")]);$("app").innerHTML=`<div class="hero"><h1>Welcome, ${esc(me.username)}</h1><p>Choose your test. Full test: 100 marks, 90 minutes, 1/3 negative marking (practice setting).</p><div class="row"><button class="outline" onclick="history()">My results</button><button class="outline" onclick="leader()">Leaderboard</button>${me.role==="admin"?'<button class="outline" onclick="admin()">Owner dashboard</button>':''}</div></div>${disclaimer()}<h2>Separate tests</h2><div class="grid">${t.tests.map(x=>`<div class="card"><h3>${esc(x.title)}</h3><p class="muted">100 questions · 90 minutes · available questions: ${x.available}</p><button class="primary" onclick="start('${x.key}')">Start test</button></div>`).join("")}</div><h2>Notifications 2026</h2>${n.rows.map(x=>`<div class="card"><h3>${esc(x.title)}</h3><p>${esc(x.details)}</p><a href="${esc(x.url)}" target="_blank">Open source ↗</a></div>`).join("")}`}catch(e){$("app").innerHTML=`<div class="card">${esc(e.message)} <button onclick="authUI()">Login</button></div>`}}
async function start(k){try{test=await api("/tests/"+k+"/start",{method:"POST",body:"{}"});i=0;answers={};secs=5400;draw();clearInterval(clock);clock=setInterval(()=>{secs--;if($("timer"))$("timer").textContent=fmt(secs);if(secs<=0)submit(true)},1000)}catch(e){alert(e.message)}}
function fmt(n){return String(Math.floor(Math.max(0,n)/60)).padStart(2,"0")+":"+String(Math.max(0,n)%60).padStart(2,"0")}
function draw(){$("app").innerHTML=`<div class="card"><div class="row"><b>${esc(test.title)} · ${i+1}/${test.questions.length}</b><span class="spacer"></span><span class="timer" id="timer">${fmt(secs)}</span></div><h3>${esc(lang==="hi"&&test.questions[i].hi?test.questions[i].hi:test.questions[i].en)}</h3>${test.questions[i].opts.map((x,j)=>`<button class="option ${answers[test.questions[i].id]===j?"chosen":""}" onclick="answers[${test.questions[i].id}]=${j};draw()">${"ABCD"[j]}. ${esc(x)}</button>`).join("")}<div class="row"><button class="outline" onclick="i=Math.max(0,i-1);draw()">Previous</button><button class="outline" onclick="i=Math.min(test.questions.length-1,i+1);draw()">Next</button><span class="spacer"></span><button class="primary" onclick="submit(false)">Submit</button></div></div><div class="card"><h3>Question palette</h3>${test.questions.map((q,j)=>`<button class="pal ${answers[q.id]!==undefined?"done":""} ${j===i?"current":""}" onclick="i=${j};draw()">${j+1}</button>`).join("")}</div>`}
async function submit(auto){if(!auto&&!confirm("Submit test?"))return;clearInterval(clock);try{let r=await api("/tests/"+test.key+"/submit",{method:"POST",body:JSON.stringify({answers})});test=null;$("app").innerHTML=`<div class="card"><h1>Result</h1><h2>${Number(r.score).toFixed(2)} / ${r.total}</h2><p>Correct: ${r.correct} · Wrong: ${r.wrong} · Unanswered: ${r.blank}</p><button class="primary" onclick="home()">Dashboard</button></div><div class="card"><h2>Answer explanations</h2>${r.review.map((q,j)=>`<p><b>Q${j+1}. ${esc(lang==="hi"&&q.hi?q.hi:q.en)}</b><br>Correct answer: ${esc(q.opts[q.ans])}<br>${esc(lang==="hi"&&q.exp_hi?q.exp_hi:q.exp_en)}</p>`).join("")}</div>`}catch(e){alert(e.message)}}
async function history(){try{let d=await api("/history");$("app").innerHTML=`<div class="card"><h2>Test history</h2><button onclick="home()">Back</button><table><tr><th>User</th><th>Test</th><th>Score</th><th>Date</th></tr>${d.rows.map(x=>`<tr><td>${esc(x.username||me.username)}</td><td>${esc(x.title)}</td><td>${x.score}/${x.total}</td><td>${esc(x.created_at)}</td></tr>`).join("")}</table></div>`}catch(e){alert(e.message)}}
async function leader(){try{let d=await api("/leaderboard");$("app").innerHTML=`<div class="card"><h2>Leaderboard</h2><button onclick="home()">Back</button><table><tr><th>Student</th><th>Best score</th><th>Attempts</th></tr>${d.rows.map(x=>`<tr><td>${esc(x.username)}</td><td>${x.best??"—"}</td><td>${x.attempts}</td></tr>`).join("")}</table></div>`}catch(e){alert(e.message)}}
async function admin(){try{if(me.role!=="admin")throw Error("Owner access only");let s=await api("/admin/stats");$("app").innerHTML=`<div class="card"><h2>Owner dashboard</h2><button onclick="home()">Back</button><div class="grid"><div class="card">Registered users<h2>${s.users}</h2></div><div class="card">Users logged in<h2>${s.loggedIn}</h2></div><div class="card">Test attempts<h2>${s.attempts}</h2></div></div><p>Active questions: ${s.questions}. Add 100 questions per category before launching full-length tests.</p><h3>Registered users</h3><table><tr><th>Username</th><th>Mobile</th><th>Registered</th><th>Last login</th></tr>${s.usersList.map(u=>`<tr><td>${esc(u.username)}</td><td>${esc(u.mobile||"—")}</td><td>${esc(u.created_at)}</td><td>${esc(u.last_login||"Never")}</td></tr>`).join("")}</table></div><div class="card"><h2>Add question</h2><form onsubmit="addQ(event)"><label>Category</label><select id="cat"><option>Maths</option><option>General Knowledge</option><option>Reasoning</option><option>General Science</option></select><label>Question English</label><textarea id="en" required></textarea><label>Question Hindi</label><textarea id="hi"></textarea>${[0,1,2,3].map(j=>`<label>Option ${"ABCD"[j]}</label><input id="o${j}" required>`).join("")}<label>Correct option</label><select id="ans"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select><label>Explanation English</label><textarea id="ee"></textarea><label>Explanation Hindi</label><textarea id="eh"></textarea><button class="primary">Save question</button></form></div><div class="card"><h2>Publish notification</h2><form onsubmit="addN(event)"><label>Title</label><input id="nt" required><label>Details</label><textarea id="nd" required></textarea><label>URL</label><input id="nu" type="url" required value="https://rrb.indianrailways.gov.in/"><label>Date</label><input id="ndate" value="2026"><button class="primary">Publish</button></form></div>`}catch(e){alert(e.message)}}
async function addQ(e){e.preventDefault();try{await api("/admin/questions",{method:"POST",body:JSON.stringify({category:$("cat").value,en:$("en").value,hi:$("hi").value,opts:[0,1,2,3].map(j=>$("o"+j).value),ans:+$("ans").value,exp_en:$("ee").value,exp_hi:$("eh").value})});alert("Saved");admin()}catch(x){alert(x.message)}}
async function addN(e){e.preventDefault();try{await api("/admin/notices",{method:"POST",body:JSON.stringify({title:$("nt").value,details:$("nd").value,url:$("nu").value,date_label:$("ndate").value,is_official:$("nu").value.includes("indianrailways.gov.in")})});alert("Published");home()}catch(x){alert(x.message)}}
init();
</script></body></html>
